worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
    }

    upstream directory_service_upstream {
        zone directory_service_upstream 64k;
        server directory-service:5353 resolve;
    }

    upstream auth_service_upstream {
        zone auth_service_upstream 64k;
        server auth-service:5353 resolve;
    }

    upstream file_service_upstream {
        zone file_service_upstream 64k;
        server file-service:5353 resolve;
    }

    upstream minio_upstream {
        zone minio_upstream 64k;
        server minio_fs:9000 resolve;
    }

    server {
        listen 80 default_server;
        server_name localhost;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # /api/directory/locations -> /api/locations
        location /api/directory/ {
            proxy_pass http://directory_service_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/directory;
        }

        # AuthService already owns the /api/auth/* route, so preserve it.
        location /api/auth/ {
            proxy_pass http://auth_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User administration endpoints are also served by AuthService.
        location /api/users {
            proxy_pass http://auth_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FileService already owns the /api/files/* route, so preserve it.
        location /api/files/ {
            proxy_pass http://file_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # Browser-facing S3 endpoint. The public port is owned by nginx; MinIO stays
    # internal. Keeping both Host and URI unchanged preserves the AWS V4 signature.
    server {
        listen 9000;
        server_name localhost;

        client_max_body_size 0;

        location / {
            proxy_pass http://minio_upstream;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
