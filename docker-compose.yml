services:
  
  directory-service:
    container_name: directory-service
    build:
      context: ./DirectoryService
      dockerfile: Dockerfile
    ports:
      - "5353:5353"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5353

  postgres_ds:
    container_name: postgres-ds
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: directory_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
        
  seq_ds:
    image: datalust/seq:latest
    container_name: seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:5341" 
      - "8081:80"   
    volumes:
      - seq_data:/data    
      
  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: 
      always
    
  file-service:
    container_name: file-service-ds
    build:
      context: ./FileService
      dockerfile: Dockerfile
      args:
        - NUGET_USERNAME=${NUGET_USERNAME}
        - NUGET_PASSWORD=${NUGET_PASSWORD}
    ports:
      - "5555:5353"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5353
  
  postgres_fs:
    container_name: postgres-fs
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: fileservice_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"
    volumes:
      - postgres-data-fs:/var/lib/postgresql/data
  
  minio_fs: 
    container_name: minio_fs
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9002:9001"
    environment: 
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    restart: always


volumes: 
  postgres-data:
  seq_data:
  postgres-data-fs:
  
  