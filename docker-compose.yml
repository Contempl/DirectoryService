services:
  
  directory-service:
    container_name: directory-service
    build:
      context: .
      dockerfile: DirectoryService/Dockerfile
      args:
        - NUGET_USERNAME=${NUGET_USERNAME}
        - NUGET_PASSWORD=${NUGET_PASSWORD}
    ports:
      - "5353:5353"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5353
      - DevAuth__Enabled=true
      - JwtOptions__Secret=${JWT_SECRET}
      - RabbitMq__Host=rabbitmq
      - FileServiceOptions__Url=http://file-service-ds:5353
      - CachingOptions__RedisConnectionString=redis:6379
      - CachingOptions__RedisEnabled=true
      - ConnectionStrings__Database=Server=postgres_ds;Port=5432;Username=postgres;Password=postgres;Database=directory_service_db
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres_ds:
    container_name: postgres-ds
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: directory_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
        
  seq_ds:
    image: datalust/seq:latest
    container_name: seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:5341" 
      - "8081:80"   
    volumes:
      - seq_data:/data    
      
  redis:
    container_name: redis
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    restart: 
      always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    
  file-service:
    depends_on:
      rabbitmq:
        condition: service_healthy
    container_name: file-service-ds
    build:
      context: .
      dockerfile: FileService/Dockerfile
      args:
        - NUGET_USERNAME=${NUGET_USERNAME}
        - NUGET_PASSWORD=${NUGET_PASSWORD}
    ports:
      - "5555:5353"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5353
      - JwtOptions__Secret=${JWT_SECRET}
      - RabbitMq__Host=rabbitmq
  
  postgres_fs:
    container_name: postgres-fs
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: fileservice_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"
    volumes:
      - postgres-data-fs:/var/lib/postgresql/data
  
  minio_fs: 
    container_name: minio_fs
    image: minio/minio:latest
    networks:
      default:
        aliases:
          - minio
    ports:
      - "9000:9000"
      - "9002:9001"
    environment: 
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    restart: always

  auth-service:
    container_name: auth-service-backend
    build:
      context: ./AuthService
      dockerfile: Dockerfile
      args:
        - NUGET_USERNAME=${NUGET_USERNAME}
        - NUGET_PASSWORD=${NUGET_PASSWORD}
    ports: 
      - "5656:5353"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5353
  
  postgres_as:
    container_name: postgres_as
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: authservice_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - postgres-data-as:/var/lib/postgressql/data    

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: fileservice
      RABBITMQ_DEFAULT_PASS: fileservice
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  
volumes: 
  postgres-data:
  seq_data:
  postgres-data-fs:
  postgres-data-as:
  redis-data:
  rabbitmq-data:
